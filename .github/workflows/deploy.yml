name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Served from https://fayo08.github.io/<repo-name>/
          BASE_PATH: /${{ github.event.repository.name }}/
          # The deployed API. Override with a repository variable named VITE_API_URL.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://findmymechanic-api-fayo08.onrender.com' }}
          # CARTO basemap key, stored as a repository secret named CARTO
          VITE_CARTO_KEY: ${{ secrets.CARTO }}
      # Single-page app: serve index.html for deep links like /warehouse/1
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref_name == 'main' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
